@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap');

.e-root *, .e-root *::before, .e-root *::after { box-sizing: border-box; }
.e-root {
  --paper:#FFFCF4; --linen:#FDEFD4; --edge:#EFE0C6; --ink:#2B2724; --soft:#7C6F60;
  --blue:#2F6BE4; --sun:#F6B60B; --mint:#2FB786; --berry:#EF5D8C; --grape:#8A6BB1;
  --mintbg:#DFF6EC;
  background:
    radial-gradient(900px 300px at 12% -60px, #FFE9F1 0%, rgba(255,233,241,0) 70%),
    radial-gradient(700px 260px at 92% -40px, #DFF0FF 0%, rgba(223,240,255,0) 70%),
    var(--paper);
  color: var(--ink);
  font-family:'Nunito', ui-sans-serif, system-ui, sans-serif;
  min-height:100%; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.e-root h1,.e-root h2,.e-root h3 { font-family:'Bricolage Grotesque','Nunito',sans-serif; }
.e-wrap { max-width:820px; margin:0 auto; padding:0 16px 150px; }

/* en-tête : les perles posées sur l'étagère */
.e-head { padding:22px 0 14px; }
.e-title { font-family:'Bricolage Grotesque',sans-serif; font-size:30px; font-weight:800;
  letter-spacing:-.035em; line-height:1.05; margin:0; }
@media (min-width:760px) { .e-title { font-size:38px; } }
.e-sub { color:var(--soft); font-size:14px; font-weight:600; margin:3px 0 0; }
.e-beadrow { display:flex; gap:7px; margin:16px 0 0; padding-left:2px; }
.e-beadrow span { width:15px; height:15px; border-radius:50%;
  box-shadow: inset -3px -3px 4px rgba(0,0,0,.18), inset 2px 2px 4px rgba(255,255,255,.55); }
.e-shelf { height:8px; border-radius:5px; margin-top:5px;
  background:linear-gradient(180deg,#E0AE74,#B98449 55%,#96632F);
  box-shadow:0 3px 6px rgba(150,99,47,.28); }

/* onglets, une couleur par onglet */
.e-tabs { position:sticky; top:0; z-index:20; background:var(--paper);
  display:flex; gap:5px; padding:11px 0 9px; }
.e-tab { flex:1; appearance:none; border:0; background:transparent; cursor:pointer;
  font:inherit; font-weight:700; font-size:13.5px; color:var(--soft);
  padding:10px 2px; border-radius:999px; transition:background .15s ease, color .15s ease; }
.e-tabs .e-tab:nth-of-type(1)[aria-selected="true"] { background:#FFE7B0; color:#8A5300; }
.e-tabs .e-tab:nth-of-type(2)[aria-selected="true"] { background:#D6E9FF; color:#14508F; }
.e-tabs .e-tab:nth-of-type(3)[aria-selected="true"] { background:#D5F5E6; color:#0E6A4C; }
.e-tabs .e-tab:nth-of-type(4)[aria-selected="true"] { background:#EBE1FB; color:#59389B; }
.e-tab:focus-visible, .e-root button:focus-visible, .e-root input:focus-visible,
.e-root select:focus-visible, .e-root textarea:focus-visible {
  outline:3px solid var(--blue); outline-offset:2px; }

.e-eyebrow { font-family:'Bricolage Grotesque',sans-serif; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--soft); font-weight:800; margin:26px 0 11px; }

/* champs */
.e-field { display:block; margin-bottom:11px; }
.e-label { display:block; font-size:12.5px; font-weight:700; color:var(--soft); margin-bottom:5px; }
.e-in, .e-sel, .e-ta { width:100%; font:inherit; font-weight:600; color:var(--ink); background:#fff;
  border:2px solid var(--edge); border-radius:13px; padding:10px 12px; }
.e-in:focus, .e-sel:focus, .e-ta:focus { border-color:var(--blue); }
.e-ta { min-height:66px; resize:vertical; }
.e-row { display:flex; gap:8px; }
.e-row > * { flex:1; min-width:0; }

.e-btn { appearance:none; font:inherit; font-weight:800; font-size:14px; cursor:pointer;
  border:2px solid var(--blue); background:var(--blue); color:#fff;
  border-radius:999px; padding:10px 17px; box-shadow:0 2px 0 rgba(23,66,150,.35);
  transition:transform .1s ease; }
.e-btn:active { transform:translateY(2px); box-shadow:none; }
.e-btn.ghost { background:#fff; color:var(--ink); border-color:var(--edge); box-shadow:none; }
.e-btn.tiny { padding:6px 12px; font-size:12.5px; }
.e-btn[disabled] { opacity:.4; cursor:not-allowed; }

/* carte cours */
.e-card { display:flex; gap:11px; align-items:flex-start; background:#fff;
  border:2px solid var(--edge); border-radius:18px; padding:12px 13px; margin-bottom:9px;
  box-shadow:0 2px 10px rgba(120,90,40,.06); }
.e-spine { width:7px; align-self:stretch; border-radius:5px; flex:none; }
.e-cardbody { flex:1; min-width:0; }
.e-ctitle { font-weight:800; font-size:15.5px; letter-spacing:-.01em; }
.e-meta { font-size:12.5px; font-weight:600; color:var(--soft); margin-top:2px; }
.e-notes { font-size:13px; color:var(--soft); margin-top:6px; font-style:italic; }
.e-acts { display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none; }

.e-chip { display:inline-flex; align-items:center; gap:5px; font-size:12px;
  font-weight:800; padding:3px 10px; border-radius:999px;
  background:var(--linen); color:var(--ink); }
.e-dot { width:8px; height:8px; border-radius:50%; flex:none; }

/* calendrier */
.e-cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.e-dow { text-align:center; font-size:11.5px; font-weight:800; color:var(--soft); padding-bottom:2px; }
.e-day { position:relative; aspect-ratio:1/1.12; border:2px solid var(--edge);
  background:#fff; border-radius:14px; padding:5px 4px 4px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font:inherit; color:inherit; transition:transform .12s ease, box-shadow .12s ease; }
.e-day.out { opacity:.35; }
.e-day.today { border-color:var(--blue); }
.e-day.sel { background:var(--linen); border-color:#E0C48A; }
.e-day.full { background:var(--mintbg); border-color:#A9E3CA; }
.e-day.armed:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(47,107,228,.18); }
.e-day.armed:active { transform:scale(.94); }
.e-dnum { font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
.e-star { position:absolute; top:3px; right:5px; font-size:12px; color:var(--sun); line-height:1; }
.e-beads { display:flex; flex-wrap:wrap; justify-content:center; gap:3px; padding:0 2px; }
.e-bead { width:9px; height:9px; border-radius:50%;
  box-shadow: inset -2px -2px 3px rgba(0,0,0,.22), inset 1px 1px 2px rgba(255,255,255,.6); }
.e-more { font-size:10px; color:var(--soft); font-weight:800; }

.e-navrow { display:flex; align-items:center; justify-content:space-between; margin:16px 0 12px; }
.e-month { font-family:'Bricolage Grotesque',sans-serif; font-size:21px; font-weight:800;
  letter-spacing:-.025em; text-transform:capitalize; }
.e-arrow { appearance:none; border:2px solid var(--edge); background:#fff; color:var(--ink);
  width:38px; height:38px; border-radius:50%; font-size:17px; font-weight:800; cursor:pointer; }
.e-arrow:active { background:var(--linen); }

.e-daypanel { margin-top:18px; padding-top:4px; }
.e-empty { color:var(--soft); font-size:13.5px; font-weight:600; background:var(--linen);
  border-radius:16px; padding:15px; }

/* barre « en main » */
.e-hand { position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:#2B2724; color:#FFF7E8; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:stretch; gap:8px;
  border-radius:20px 20px 0 0; box-shadow:0 -6px 20px rgba(0,0,0,.18); }
.e-hand .lbl { font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.7; font-weight:800; }
.e-hand .nm { font-weight:800; font-size:14.5px; }
.e-hand button { appearance:none; border:2px solid rgba(255,247,232,.4); background:transparent;
  color:#FFF7E8; font:inherit; font-size:12.5px; font-weight:800;
  border-radius:999px; padding:7px 13px; cursor:pointer; flex:none; }
.e-handtop { display:flex; align-items:center; gap:10px; }
.e-handrow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.e-hpill { appearance:none; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer;
  border:2px solid rgba(255,247,232,.35); background:transparent; color:#FFF7E8;
  border-radius:999px; padding:5px 12px; min-width:36px; }
.e-hpill[aria-pressed="true"] { background:var(--sun); color:#3A2A00; border-color:var(--sun); }
.e-handhint { font-size:12px; opacity:.75; font-weight:600; }

/* progression */
.e-bar { height:12px; border-radius:999px; background:var(--linen); overflow:hidden; }
.e-bar > i { display:block; height:100%; border-radius:999px; }
.e-statrow { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.e-statrow .nm { flex:1.1; min-width:0; font-size:13.5px; font-weight:700;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.e-statrow .bx { flex:1.6; }
.e-statrow .vl { font-size:12.5px; font-weight:700; color:var(--soft);
  font-variant-numeric:tabular-nums; flex:none; width:58px; text-align:right; }
.e-cols { display:flex; align-items:flex-end; gap:7px; height:120px; margin-top:6px; }
.e-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; height:100%; }
.e-col .stack { position:relative; border-radius:8px 8px 3px 3px; background:var(--linen); }
.e-col .stack > i { position:absolute; left:0; right:0; bottom:0; background:var(--mint);
  border-radius:8px 8px 3px 3px; }
.e-col .cap { text-align:center; font-size:10.5px; font-weight:700; color:var(--soft); }

.e-big { font-family:'Bricolage Grotesque',sans-serif; font-size:40px; font-weight:800;
  letter-spacing:-.04em; line-height:1; }
.e-legend { font-size:12.5px; color:var(--soft); font-weight:600; margin-top:12px; line-height:1.6; }

.e-list-line { display:flex; align-items:center; gap:9px; padding:9px 0;
  border-bottom:2px dotted var(--edge); }
.e-check { appearance:none; width:23px; height:23px; flex:none; border-radius:50%;
  border:2.4px solid var(--edge); background:#fff; cursor:pointer; transition:transform .12s ease; }
.e-check:checked { background:var(--mint); border-color:var(--mint); transform:scale(1.06);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.5l3 3 6-6.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-size:17px; background-position:center; background-repeat:no-repeat; }
.e-x { appearance:none; border:0; background:transparent; color:var(--soft);
  font:inherit; font-size:19px; line-height:1; cursor:pointer; padding:4px 7px; flex:none; }
.e-done .nm { text-decoration:line-through; color:var(--soft); }

.e-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:40;
  background:var(--mint); color:#06301F; font-size:13.5px; font-weight:800;
  padding:10px 16px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.18); }

/* regroupements */
.e-group { display:flex; align-items:center; gap:9px; margin:20px 0 10px;
  padding:8px 13px; border-radius:999px; }
.e-group .nm { font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
  font-size:15.5px; letter-spacing:-.015em; flex:1; }
.e-gcount { font-size:12px; font-weight:800; color:var(--ink);
  background:rgba(255,255,255,.72); border-radius:999px; padding:2px 9px;
  font-variant-numeric:tabular-nums; }
.e-seg { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:11px; }
.e-pill { appearance:none; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  border:2px solid var(--edge); background:#fff; color:var(--soft);
  border-radius:999px; padding:6px 13px; display:inline-flex; align-items:center; gap:6px; }
.e-pill[aria-pressed="true"] { background:var(--sun); color:#3A2A00; border-color:var(--sun); }
.e-seglabel { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--soft); font-weight:800; margin-right:2px; }

/* journée dépliée */
.e-wday { border:2px solid var(--edge); background:#fff; border-radius:18px;
  padding:10px 13px 5px; margin-bottom:9px; box-shadow:0 2px 10px rgba(120,90,40,.05); }
.e-wday.today { border-color:var(--blue); }
.e-wday.sel { background:var(--linen); }
.e-wdhead { display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding-bottom:5px; }
.e-wdname { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:15px;
  text-transform:capitalize; flex:1; letter-spacing:-.015em; text-align:left;
  appearance:none; border:0; background:transparent; color:inherit; padding:0; cursor:pointer; }
.e-wday .e-gcount { background:var(--linen); }
.e-wday.sel .e-gcount { background:rgba(255,255,255,.8); }
.e-wdempty { color:var(--soft); font-size:13px; font-weight:600; font-style:italic; margin:2px 0 9px; }
.e-wday .e-list-line:last-child { border-bottom:0; }

/* rappel */
.e-nag { display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:600;
  line-height:1.5; background:#FFF0C2; border:2px solid #F3D172; border-radius:16px;
  padding:11px 8px 11px 13px; margin-bottom:6px; }

/* écran large : la grille accueille les intitulés, les perles s'effacent */
.e-daylist { display:none; }
@media (min-width: 760px) {
  .e-wrap { max-width:1000px; }
  .e-day { aspect-ratio:auto; min-height:112px; align-items:stretch; padding:6px 6px 5px; gap:3px; }
  .e-dnum { align-self:flex-start; }
  .e-beads { display:none; }
  .e-daylist { display:flex; flex-direction:column; gap:3px; width:100%;
    overflow:hidden; text-align:left; }
  .e-dl { font-size:11px; font-weight:700; line-height:1.3; border-left:4px solid;
    border-radius:4px; padding:2px 0 2px 6px; background:rgba(0,0,0,.028);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .e-dl.done { opacity:.5; text-decoration:line-through; }
  .e-daylist .e-more { text-align:left; padding-left:6px; }
}

@media (prefers-reduced-motion: reduce) {
  .e-root *, .e-root *::before { transition:none !important; animation:none !important; }
}
